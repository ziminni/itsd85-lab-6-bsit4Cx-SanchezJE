name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a manual "Run workflow" button

jobs:
  test:
    name: test
    runs-on: ubuntu-latest # free GitHub-hosted runner
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: deploy
    needs: test # runs only if 'test' succeeded
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, deploy]
    concurrency:
      group: production # never run two deploys at once
      cancel-in-progress: false
    env:
      APP_VERSION: ${{ github.sha }} # the commit ID becomes the app version
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Build image and restart container
        run: docker compose -p itsd85 up -d --build --remove-orphans

      - name: Health check (the new version must answer)
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/health | grep -q "$APP_VERSION"; then
              echo "Deployed $APP_VERSION successfully"
              exit 0
            fi
            echo "Waiting for the app... attempt $i"
            sleep 2
          done
          echo "Health check failed"
          docker compose -p itsd85 logs --tail 50
          exit 1

      - name: Remove unused image layers
        if: always()
        run: docker image prune -f
